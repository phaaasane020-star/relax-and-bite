<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Relax&amp;Bite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #3f292b;
        font-family: system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: #ef4444;
      }
      p {
        color: #7a6a6b;
        max-width: 280px;
        line-height: 1.5;
      }
      button {
        background: #ef4444;
        color: #fff;
        border: 0;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 28px;
      }
    </style>
  </head>
  <body>
    <!-- Shown only if the app can't reach Relax&Bite (no internet, or the server is off) -->
    <main>
      <div class="logo">Relax&amp;<span>Bite</span></div>
      <p>We can't connect right now. Check that your phone has internet, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
